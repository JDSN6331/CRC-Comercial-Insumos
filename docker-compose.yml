services:
  postgres:
    image: postgres:16-alpine
    container_name: crc-postgres
    environment:
      POSTGRES_DB: crc_chat
      POSTGRES_USER: crc_user
      POSTGRES_PASSWORD: crc_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crc_user -d crc_chat"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
